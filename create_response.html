    <div class="container">

        

<div class="row">
    <div class="col-4"></div>

        <form method="post" enctype="multipart/form-data">
            <input type="hidden" name="csrfmiddlewaretoken" value="WkSDxKe2WLzmtCWwsXiWrKMwqnr1ZmjeDY6xG76sem17j5t9tYaSYirmD2DyKKJG">
            
            


    
    <div id="div_id_figi" class="form-group has-error">
        
            <label for="id_figi"  class="control-label  requiredField">
                Figi<span class="asteriskField">*</span>
            </label>
        

        

        

        
            
                <div class="controls ">
                        
                        <input type="text" name="figi" value="TESTFIGI123" maxlength="255" class="textinput form-control" required aria-invalid="true" aria-describedby="id_figi_error" id="id_figi">
                        
                    


    
    
        <p id="error_1_id_figi" class="help-block"><strong>Акция with this Figi already exists.</strong></p>
    





    



                </div>
            
        
    </div>
    


            
            


    
    <div id="div_id_isin" class="form-group">
        
            <label for="id_isin"  class="control-label  requiredField">
                Isin<span class="asteriskField">*</span>
            </label>
        

        

        

        
            
                <div class="controls ">
                        
                        <input type="text" name="isin" value="US0000000000" maxlength="255" class="textinput form-control" required id="id_isin">
                        
                    


    




    



                </div>
            
        
    </div>
    


            
            


    
    <div id="div_id_name" class="form-group">
        
            <label for="id_name"  class="control-label  requiredField">
                Наименование компании<span class="asteriskField">*</span>
            </label>
        

        

        

        
            
                <div class="controls ">
                        
                        <input type="text" name="name" value="Test Company" maxlength="255" class="textinput form-control" required id="id_name">
                        
                    


    




    



                </div>
            
        
    </div>
    


            
            


    
    <div id="div_id_ticker" class="form-group has-error">

            </label>
        

        

        

        
            
                <div class="controls ">
                        
                        <input type="text" name="ticker" value="TST" maxlength="10" class="textinput form-control" required aria-invalid="true" aria-describedby="id_ticker_error" id="id_ticker">
                        
                    


    
    
        <p id="error_1_id_ticker" class="help-block"><strong>Акция with this Тикер already exists.</strong></p>
    





    



                </div>
            
        
    </div>
    


            
            


    
    <div id="div_id_currency" class="form-group">

            </label>
        

        

        

        
            
                <div class="controls ">

                </div>
            
        
    </div>
    


            
            


    
    <div id="div_id_uid" class="form-group has-error">
        
            <label for="id_uid"  class="control-label  requiredField">
                Uid<span class="asteriskField">*</span>
            </label>
        

        

        

        
            
                <div class="controls ">
                        
                        <input type="text" name="uid" value="11111111-2222-3333-4444-555555555555" maxlength="255" class="textinput form-control" required aria-invalid="true" aria-describedby="id_uid_error" id="id_uid">

    </div>

            </label>
        

        

        

        
            
                <div class="controls ">
                        
                        <input type="number" name="last_price" step="any" class="numberinput form-control" id="id_last_price">
                        
                    


    




    



                </div>
            
        
    </div>
    


            
            


    
    <div id="div_id_is_trend_high" class="form-group">
        
            <label for="id_is_trend_high"  class="control-label ">

            </label>
        

        

        

        
            
                <div class="controls ">
                        
                        <select name="is_trend_high" class="nullbooleanselect form-control" id="id_is_trend_high">
  <option value="unknown" selected>Unknown</option>

  <option value="true">Yes</option>

  <option value="false">No</option>

</select>
                        
                    


    




    



                </div>
            
        
    </div>
    


            
            <button class="w-100 btn btn-lg btn-primary mt-5" type="submit">Сохранить</button>
